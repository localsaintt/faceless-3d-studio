      - {type: cone, attach: truck, from: 4.0}
      - {type: boom, at: 5.0, pos: [6, 0, 2], strength: 0.6}
    camera: {move: pan_follow, from: [-14, -8, 2.6], follow: truck, lens: 30, fstop: 0.05}
    hud:
      - {label: "SPEED OF SOUND", value: 7, unit: "mph"}
      - {label: "SONIC BOOMS", from: 240, to: 241, at: 5.0, dur: 0.1}
    sfx:
      - {id: engine, at: 2.8}
      - {id: boom, at: 5.0}

  - id: s08
    set: beach
    duration: 4.5
    vo: "Ten seconds later, sound snaps back to normal."
    effects:
      - {type: ring_field, at: -3.0, count: 22, area: [[-30, 30], [-20, 0]], speed: 3.13, max_r: 8, spread: 3.0}
    camera: {move: static, from: [-6, 8, 18], target_from: [0, -10, 0], lens: 30, fstop: 0.06}
    hud:
