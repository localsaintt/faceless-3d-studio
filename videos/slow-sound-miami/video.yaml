      - {id: boom_small, at: 2.6}
      - {id: boom_small, at: 4.1}
      - {id: pop, at: 4.9}

  - id: s06
    set: beach
    duration: 6.5
    vo: "Meanwhile, four thousand people are talking, and nobody hears anyone on time."
    effects:
      - {type: ring_field, at: 0.0, count: 20, area: [[-25, 25], [-20, 0]], speed: 3.13, max_r: 7, spread: 5.0}
    camera: {move: crane_up, from: [-15, 7, 2.4], to: [-12, 6, 13], target_from: [-3, -10, 1.2], target_to: [-1, -10, 0.5], lens: 30, fstop: 0.06}
    hud:
      - {label: "SPEED OF SOUND", value: 7, unit: "mph"}
      - {label: "TALKING, BUT LATE", value: 4200, unit: "people"}
    sfx:
      - {id: murmur, at: 0.0}

  - id: s07
    set: street
    duration: 7.0
    vo: "The ice cream truck plays its song, then drives straight through it."
    actors:
      - {type: truck, id: truck, lane: 2.0, start_x: -4, speed_mph: 0, go: {at: 2.8, speed_mph: 12}}
    effects:
